<section id="spar-winners" aria-labelledby="spar-winners-title">
  <h2 id="spar-winners-title" class="spar-winners__title">Победители розыгрыша</h2>
  <div class="spar-winners__inner">
    <label class="spar-winners__search-label" for="spar-winners-search">Поиск по номеру участника</label>
    <input id="spar-winners-search" class="spar-winners__search" type="search" placeholder="Поиск по номеру участника" autocomplete="off" maxlength="80" aria-controls="spar-winners-table">
    <div class="spar-winners__dates" role="group" aria-label="Дата розыгрыша">
<button class="spar-winners__date" type="button" data-draw="2026-05-27" aria-pressed="true" aria-controls="spar-winners-table">27.05.2026</button>
<button class="spar-winners__date" type="button" data-draw="2026-06-03" aria-pressed="false" aria-controls="spar-winners-table">03.06.2026</button>
<button class="spar-winners__date" type="button" data-draw="2026-06-10" aria-pressed="false" aria-controls="spar-winners-table">10.06.2026</button>
<button class="spar-winners__date" type="button" data-draw="2026-06-17" aria-pressed="false" aria-controls="spar-winners-table">17.06.2026</button>
<button class="spar-winners__date" type="button" data-draw="2026-06-24" aria-pressed="false" aria-controls="spar-winners-table">24.06.2026</button>
<button class="spar-winners__date" type="button" data-draw="2026-07-01" aria-pressed="false" aria-controls="spar-winners-table">01.07.2026</button>
    </div>
    <div class="spar-winners__table-wrap">
      <table id="spar-winners-table" class="spar-winners__table" aria-label="Победители розыгрыша за 27.05.2026">
        <thead><tr><th scope="col">№ участника</th><th scope="col">ФИО</th><th scope="col">Приз</th></tr></thead>
        <tbody><tr><td class="spar-winners__empty" colspan="3">Победителей пока нет</td></tr></tbody>
      </table>
    </div>
    <p class="spar-winners__status" role="status" aria-live="polite" aria-atomic="true"></p>
  </div>
</section>
