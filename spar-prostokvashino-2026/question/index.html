<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Задать вопрос — SPAR</title><link rel="stylesheet" href="question.css"><style>body{margin:0;background:#0f7ed9}</style></head><body><section id="spar-question" aria-labelledby="spar-question-title">
  <div class="spar-question__content">
    <div class="spar-question__copy">
      <h2 id="spar-question-title" class="spar-question__title"><span>Не нашёл ответа</span><span>на свой вопрос?</span></h2>
      <p class="spar-question__description">Задай его нам, и мы обязательно ответим!</p>
      <a class="spar-question__button" href="mailto:skubev@spar-nn.ru?subject=%D0%92%D0%BE%D0%BF%D1%80%D0%BE%D1%81%20%D0%BF%D0%BE%20%D0%B0%D0%BA%D1%86%D0%B8%D0%B8%20%C2%AB%D0%9F%D0%BE%D0%B9%D0%BC%D0%B0%D0%B9%20%D0%B2%D0%BE%D0%BB%D0%BD%D1%83%20%D1%83%D0%B4%D0%B0%D1%87%D0%B8%C2%BB" aria-label="Задать вопрос по электронной почте skubev@spar-nn.ru">Задать вопрос</a>
    </div>
    <img class="spar-question__image" src="assets/b1585.png" alt="Задумчивый Матроскин со знаком вопроса" width="425" height="390" decoding="async">
  </div>
</section>
<!-- SPAR repeat scroll motion -->
<style>#spar-question .spar-scroll-motion{opacity:0;translate:0 16px;transition:opacity 300ms cubic-bezier(.23,1,.32,1),translate 300ms cubic-bezier(.23,1,.32,1)}
#spar-question .spar-scroll-motion.is-in-view,#spar-question .spar-scroll-motion:focus-within{opacity:1;translate:0 0}
@media(prefers-reduced-motion:reduce){#spar-question .spar-scroll-motion{translate:none;transition:opacity 150ms ease}}
@media print{#spar-question .spar-scroll-motion{opacity:1;translate:none}}
</style>
<script>(()=>{const root=document.getElementById("spar-question");if(!root||root.dataset.scrollMotion||!("IntersectionObserver" in window))return;root.dataset.scrollMotion="true";const observer=new IntersectionObserver(entries=>{for(const entry of entries){entry.target.classList.toggle("is-in-view",entry.isIntersecting||entry.target.contains(document.activeElement));}},{rootMargin:"-24px 0px -24px 0px",threshold:0});root.querySelectorAll(".spar-question__copy,.spar-question__image").forEach(element=>{element.classList.add("spar-scroll-motion");observer.observe(element);});})();</script></body></html>
