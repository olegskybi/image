<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Как принять участие — SPAR</title><link rel="stylesheet" href="participation.css"><style>body{margin:0;background:#0063b4}</style></head><body><section id="spar-participation" aria-labelledby="spar-participation-title">
  <h2 id="spar-participation-title" class="spar-steps__title">Как принять участие?</h2>
  <ol class="spar-steps__list" role="list" tabindex="0" aria-label="Шаги участия. Листайте свайпом, мышью или стрелками клавиатуры">
    <li class="spar-step spar-step--purchase">
      <img class="spar-step__surface" src="assets/838d0.svg" alt="" aria-hidden="true">
      <div class="spar-step__text">
        <span class="spar-step__number" aria-hidden="true">01</span>
        <h3 class="spar-step__heading">Покупайте</h3>
        <p class="spar-step__description">От 1 товара<br>из подборки</p>
      </div>
      <img class="spar-step__art spar-step__milk" src="assets/8642b.png" alt="" width="92" height="231"><img class="spar-step__art spar-step__cream" src="assets/bebcb.png" alt="" width="141" height="141">
    </li>
    <li class="spar-step spar-step--registration">
      <img class="spar-step__surface" src="assets/838d0.svg" alt="" aria-hidden="true">
      <div class="spar-step__text">
        <span class="spar-step__number" aria-hidden="true">02</span>
        <h3 class="spar-step__heading">Регистрируйте</h3>
        <p class="spar-step__description">Чеки на сайте</p>
      </div>
      <img class="spar-step__art spar-step__receipt" src="assets/2cc7c.png" alt="" width="246" height="246">
    </li>
    <li class="spar-step spar-step--prizes">
      <img class="spar-step__surface" src="assets/838d0.svg" alt="" aria-hidden="true">
      <div class="spar-step__text">
        <span class="spar-step__number" aria-hidden="true">03</span>
        <h3 class="spar-step__heading">Участвуйте</h3>
        <p class="spar-step__description spar-step__description--prizes">В розыгрыше призов</p>
      </div>
      <img class="spar-step__art spar-step__bonus" src="assets/41451.svg" alt="">
    </li>
  </ol>
</section><script src="participation.js"></script>
<!-- SPAR repeat scroll motion -->
<style>#spar-participation .spar-scroll-motion{opacity:0;translate:0 16px;transition:opacity 300ms cubic-bezier(.23,1,.32,1),translate 300ms cubic-bezier(.23,1,.32,1)}
#spar-participation .spar-scroll-motion.is-in-view,#spar-participation .spar-scroll-motion:focus-within{opacity:1;translate:0 0}
@media(prefers-reduced-motion:reduce){#spar-participation .spar-scroll-motion{translate:none;transition:opacity 150ms ease}}
@media print{#spar-participation .spar-scroll-motion{opacity:1;translate:none}}
</style>
<script>(()=>{const root=document.getElementById("spar-participation");if(!root||root.dataset.scrollMotion||!("IntersectionObserver" in window))return;root.dataset.scrollMotion="true";const observer=new IntersectionObserver(entries=>{for(const entry of entries){entry.target.classList.toggle("is-in-view",entry.isIntersecting||entry.target.contains(document.activeElement));}},{rootMargin:"-24px 0px -24px 0px",threshold:0});root.querySelectorAll(".spar-steps__title,.spar-steps__list").forEach(element=>{element.classList.add("spar-scroll-motion");observer.observe(element);});})();</script></body></html>
