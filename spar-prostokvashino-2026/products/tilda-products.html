<!-- SPAR: Товары-участники. Отдельный T123 после блока призов. -->
<style>
@font-face{font-family:SparProducts;font-style:normal;font-weight:400;font-display:swap;src:url("https://raw.githubusercontent.com/olegskybi/image/main/spar-prostokvashino-2026/products/assets/spar-normal.ttf") format("truetype")}
@font-face{font-family:SparProducts;font-style:normal;font-weight:700;font-display:swap;src:url("https://raw.githubusercontent.com/olegskybi/image/main/spar-prostokvashino-2026/products/assets/spar-bold.ttf") format("truetype")}
#spar-products{background:#0f7ed9;color:#fff;font-family:SparProducts,Arial,sans-serif;padding:60px 0 40px;isolation:isolate}
#spar-products,#spar-products *{box-sizing:border-box}
#spar-products .spar-products__title{font:700 48px/58px SparProducts,Arial,sans-serif;letter-spacing:1px;text-align:center;margin:0 20px 45px;color:#fff}
#spar-products .spar-products__slider{display:grid;grid-template-columns:44px minmax(0,802px) 44px;align-items:center;justify-content:center;gap:32px;max-width:1076px;width:calc(100% - 64px);margin:0 auto;background:#99d1ff;border-radius:32px;padding:40px 60px}
#spar-products .spar-products__track{display:flex;gap:20px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;list-style:none;padding:0;margin:0;min-width:0;outline-offset:5px}
#spar-products .spar-products__track::-webkit-scrollbar{display:none}
#spar-products .spar-product{flex:0 0 calc((100% - 40px)/3);min-width:0;scroll-snap-align:start;background:#fff;color:#555;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-height:388px;padding-bottom:20px}
#spar-products .spar-product__image{display:block;aspect-ratio:1;width:100%;height:auto;object-fit:contain}
#spar-products .spar-product__title{font:700 18px/1.2 SparProducts,Arial,sans-serif;text-transform:uppercase;margin:0;padding:0 10px;color:#555}
#spar-products .spar-product__weight{font:italic 12px/1.2 Arial,sans-serif;margin:auto 15px 0;padding-top:24px;color:#727272}
#spar-products .spar-products__arrow{display:grid;place-items:center;width:44px;height:44px;border:0;padding:0;margin:0;background:transparent;border-radius:50%;cursor:pointer;flex:none}
#spar-products .spar-products__arrow img{display:block;width:44px;height:44px}
#spar-products .spar-products__arrow:disabled{cursor:default;opacity:.55}
#spar-products .spar-products__arrow:focus-visible,#spar-products .spar-products__track:focus-visible,#spar-products .spar-products__catalog:focus-visible{outline:3px solid #fff;outline-offset:5px}
#spar-products .spar-products__order{display:flex;align-items:center;justify-content:center;gap:32px;margin:24px 24px 0}
#spar-products .spar-products__order-title{font:700 33px/1.55 SparProducts,Arial,sans-serif;margin:0}
#spar-products .spar-products__catalog{display:inline-flex;align-items:center;justify-content:center;min-width:237px;min-height:49px;padding:12px 24px;background:#004b99;border-radius:38px;color:#fff!important;text-decoration:none!important;font:700 16px/1.55 SparProducts,Arial,sans-serif;transition:background-color .18s ease}
#spar-products .spar-products__catalog:hover{background:#003d7e}
#spar-products .spar-products__status{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(min-width:768px) and (max-width:1023px){
 #spar-products .spar-products__slider{padding:32px;gap:20px}
 #spar-products .spar-product{flex-basis:calc((100% - 20px)/2)}
}
@media(max-width:767px){
 #spar-products{padding:40px 0 40px}
 #spar-products .spar-products__title{font-size:clamp(28px,7.4vw,36px);line-height:1.15;letter-spacing:0;margin-bottom:28px}
 #spar-products .spar-products__slider{grid-template-columns:44px minmax(0,1fr) 44px;gap:16px;width:calc(100% - 32px);max-width:500px;padding:24px 20px 20px;border-radius:24px}
 #spar-products .spar-products__track{grid-column:1/-1;grid-row:1;gap:16px}
 #spar-products .spar-product{flex-basis:100%;min-height:370px}
 #spar-products .spar-products__prev{grid-column:1;grid-row:2}
 #spar-products .spar-products__next{grid-column:3;grid-row:2}
 #spar-products .spar-product__title{font-size:18px;padding:0 16px}
 #spar-products .spar-product__weight{margin-left:16px;margin-right:16px}
 #spar-products .spar-products__order{flex-direction:column;gap:12px;margin-top:24px}
 #spar-products .spar-products__order-title{font-size:28px;line-height:1.3;text-align:center}
 #spar-products .spar-products__catalog{min-height:52px;max-width:100%}
}
@media(prefers-reduced-motion:reduce){#spar-products .spar-products__catalog{transition:none}}

#spar-products .spar-products__dots{display:flex;align-items:center;justify-content:center;grid-column:2;grid-row:2;gap:0;min-width:0}
#spar-products .spar-products__dots[hidden]{display:none}
#spar-products .spar-products__dot{display:grid;place-items:center;width:32px;height:44px;flex:0 0 32px;padding:0;border:0;background:transparent;cursor:pointer;border-radius:12px}
#spar-products .spar-products__dot::before{content:"";width:10px;height:10px;border:2px solid #0f7ed9;border-radius:50%;background:transparent;transform:scale(.85);transition:background-color .22s ease,transform .22s ease}
#spar-products .spar-products__dot[aria-pressed="true"]::before{background:#0f7ed9;transform:scale(1)}
#spar-products .spar-products__dot:focus-visible{outline:2px solid #004b99;outline-offset:0}
@media(prefers-reduced-motion:reduce){#spar-products .spar-products__dot::before{transition:none}}

</style>
<section id="spar-products" aria-labelledby="spar-products-title">
  <h2 id="spar-products-title" class="spar-products__title">Товары-участники</h2>
  <div class="spar-products__slider" role="region" aria-roledescription="карусель" aria-label="Товары-участники акции">
    <button class="spar-products__arrow spar-products__prev" type="button" aria-label="Предыдущие товары" aria-controls="spar-products-track" disabled><img src="https://raw.githubusercontent.com/olegskybi/image/main/spar-prostokvashino-2026/products/assets/6556d.svg" alt="" width="44" height="44"></button>
    <ul id="spar-products-track" class="spar-products__track" tabindex="0" aria-label="Список товаров. Используйте стрелки влево и вправо для прокрутки" role="list">
      <li class="spar-product">

        <h3 class="spar-product__title">Сметана Простоквашино 15%</h3>

      <li class="spar-product">

    <button class="spar-products__arrow spar-products__next" type="button" aria-label="Следующие товары" aria-controls="spar-products-track" disabled><img src="https://raw.githubusercontent.com/olegskybi/image/main/spar-prostokvashino-2026/products/assets/de0b7.svg" alt="" width="44" height="44"></button>

  <div class="spar-products__order"><p class="spar-products__order-title">Оформить заказ</p><a class="spar-products__catalog" href="https://myspar.ru/catalog" target="_blank" rel="noopener noreferrer">Весь ассортимент</a></div>
</section>
<script>
(() => {
  const root = document.getElementById('spar-products');
  if (!root || root.dataset.initialized === 'true') return;
  root.dataset.initialized = 'true';
  const track = root.querySelector('.spar-products__track');
  const prev = root.querySelector('.spar-products__prev');
  const next = root.querySelector('.spar-products__next');
  const status = root.querySelector('.spar-products__status');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const edgeTolerance = 2;
  const cards = Array.from(track.children);
  const dots = document.createElement('div');
  dots.className = 'spar-products__dots';
  dots.setAttribute('role','group');
  dots.setAttribute('aria-label','Переключение товаров');
  next.after(dots);
  const dotButtons = cards.map((card,index) => {
    const button = document.createElement('button');
    button.type='button';button.className='spar-products__dot';
    button.setAttribute('aria-label',`Показать товар ${index + 1} из ${cards.length}`);
    button.setAttribute('aria-controls',track.id);
    button.addEventListener('click',()=>track.scrollTo({left:index * stride(),behavior:reducedMotion.matches?'instant':'smooth'}));
    dots.append(button);return button;
  });
  const stride = () => cards[0].getBoundingClientRect().width + parseFloat(getComputedStyle(track).columnGap);
  const update = () => {
    const maximum = track.scrollWidth - track.clientWidth;
    prev.disabled = track.scrollLeft <= edgeTolerance;
    next.disabled = track.scrollLeft >= maximum - edgeTolerance;
    const first = Math.round(track.scrollLeft / stride()) + 1;
    const visible = Math.max(1, Math.round((track.clientWidth + parseFloat(getComputedStyle(track).columnGap)) / stride()));
    dots.hidden = maximum <= edgeTolerance;
    dotButtons.forEach((button,index)=>button.setAttribute('aria-pressed',String(index >= first - 1 && index < first - 1 + visible)));
    status.textContent = `Товары ${first}–${Math.min(cards.length, first + visible - 1)} из ${cards.length}`;
  };
  const move = direction => track.scrollBy({left: direction * stride(), behavior: reducedMotion.matches ? 'instant' : 'smooth'});
  prev.addEventListener('click', () => move(-1));
  next.addEventListener('click', () => move(1));
  track.addEventListener('keydown', event => {
    if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
      event.preventDefault(); move(event.key === 'ArrowRight' ? 1 : -1);
    } else if (event.key === 'Home' || event.key === 'End') {
      event.preventDefault(); track.scrollTo({left:event.key === 'Home' ? 0 : track.scrollWidth,behavior:reducedMotion.matches ? 'instant' : 'smooth'});
    }
  });
  track.addEventListener('scroll', update, {passive:true});
  new ResizeObserver(update).observe(track);
  update();
})();
</script>
