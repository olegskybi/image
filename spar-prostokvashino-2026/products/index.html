<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Товары-участники — SPAR</title><link rel="stylesheet" href="products.css"><style>body{margin:0;background:#0f7ed9}</style></head><body><section id="spar-products" aria-labelledby="spar-products-title">
  <h2 id="spar-products-title" class="spar-products__title">Товары-участники</h2>
  <div class="spar-products__slider" role="region" aria-roledescription="карусель" aria-label="Товары-участники акции">
    <button class="spar-products__arrow spar-products__prev" type="button" aria-label="Предыдущие товары" aria-controls="spar-products-track" disabled><img src="assets/6556d.svg" alt="" width="44" height="44"></button>
    <ul id="spar-products-track" class="spar-products__track" tabindex="0" aria-label="Список товаров. Используйте стрелки влево и вправо для прокрутки" role="list">
      <li class="spar-product">
        <img class="spar-product__image" src="assets/bebcb.png" alt="Сметана Простоквашино 15%" width="255" height="255" decoding="async">
        <h3 class="spar-product__title">Сметана Простоквашино 15%</h3>
        <p class="spar-product__weight">300г</p>
      </li>
      <li class="spar-product">
        <img class="spar-product__image" src="assets/bebcb.png" alt="Сметана Простоквашино 15%" width="255" height="255" decoding="async">
        <h3 class="spar-product__title">Сметана Простоквашино 15%</h3>
        <p class="spar-product__weight">300г</p>
      </li>
      <li class="spar-product">
        <img class="spar-product__image" src="assets/bebcb.png" alt="Сметана Простоквашино 15%" width="255" height="255" decoding="async">
        <h3 class="spar-product__title">Сметана Простоквашино 15%</h3>
        <p class="spar-product__weight">300г</p>
      </li>
    </ul>
    <button class="spar-products__arrow spar-products__next" type="button" aria-label="Следующие товары" aria-controls="spar-products-track" disabled><img src="assets/de0b7.svg" alt="" width="44" height="44"></button>
    <p class="spar-products__status" aria-live="polite" aria-atomic="true"></p>
  </div>
  <div class="spar-products__order"><p class="spar-products__order-title">Оформить заказ</p><a class="spar-products__catalog" href="https://myspar.ru/catalog" target="_blank" rel="noopener noreferrer">Весь ассортимент</a></div>
</section><script src="products.js"></script>
<!-- SPAR repeat scroll motion -->
<style>#spar-products .spar-scroll-motion{opacity:0;translate:0 16px;transition:opacity 300ms cubic-bezier(.23,1,.32,1),translate 300ms cubic-bezier(.23,1,.32,1)}
#spar-products .spar-scroll-motion.is-in-view,#spar-products .spar-scroll-motion:focus-within{opacity:1;translate:0 0}
@media(prefers-reduced-motion:reduce){#spar-products .spar-scroll-motion{translate:none;transition:opacity 150ms ease}}
@media print{#spar-products .spar-scroll-motion{opacity:1;translate:none}}
</style>
<script>(()=>{const root=document.getElementById("spar-products");if(!root||root.dataset.scrollMotion||!("IntersectionObserver" in window))return;root.dataset.scrollMotion="true";const observer=new IntersectionObserver(entries=>{for(const entry of entries){entry.target.classList.toggle("is-in-view",entry.isIntersecting||entry.target.contains(document.activeElement));}},{rootMargin:"-24px 0px -24px 0px",threshold:0});root.querySelectorAll(".spar-products__title,.spar-products__slider,.spar-products__order").forEach(element=>{element.classList.add("spar-scroll-motion");observer.observe(element);});})();</script></body></html>
