<!-- Tilda HTML block: weekly prizes horizontal mobile scroll -->
<section class="sn-weekly-prizes" aria-label="Еженедельные призы">
  <div class="sn-weekly-prizes__viewport">
    <div class="sn-weekly-prizes__track">
      <article class="sn-weekly-prizes__item">
        <img src="https://raw.githubusercontent.com/olegskybi/image/main/assets/mondelez-weekly-prizes/weekly-prize-2000.png" alt="Еженедельный приз: 2000 рублей на запоминающиеся прогулки" loading="lazy" decoding="async">
      </article>
      <article class="sn-weekly-prizes__item">
        <img src="https://raw.githubusercontent.com/olegskybi/image/main/assets/mondelez-weekly-prizes/weekly-prize-4000.png" alt="Еженедельный приз: сертификат на яркие мероприятия на 4000 рублей" loading="lazy" decoding="async">
      </article>
      <article class="sn-weekly-prizes__item">
        <img src="https://raw.githubusercontent.com/olegskybi/image/main/assets/mondelez-weekly-prizes/weekly-prize-bandana.png" alt="Еженедельный приз: бандана Snickers" loading="lazy" decoding="async">
      </article>
    </div>
  </div>
  <div class="sn-weekly-prizes__dots" aria-hidden="true"></div>
</section>

<style>
  .sn-weekly-prizes {
    --sn-card-gap: 24px;
    --sn-card-size: clamp(278px, 31vw, 322px);
    --sn-side-pad: 20px;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    background: transparent;
    box-sizing: border-box;
    overflow: hidden;
  }

  .sn-weekly-prizes,
  .sn-weekly-prizes * {
    box-sizing: border-box;
  }

  .sn-weekly-prizes__viewport {
    width: 100%;
    max-width: calc((var(--sn-card-size) * 3) + (var(--sn-card-gap) * 2) + (var(--sn-side-pad) * 2));
    min-width: 0;
    margin: 0 auto;
    padding: 0 var(--sn-side-pad);
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    overscroll-behavior-x: contain;
    scroll-behavior: smooth;
    scroll-padding-inline: var(--sn-side-pad);
  }

  .sn-weekly-prizes__viewport::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  .sn-weekly-prizes__track {
    display: flex;
    width: max-content;
    gap: var(--sn-card-gap);
    align-items: center;
    padding: 0;
    scroll-snap-type: x proximity;
  }

  .sn-weekly-prizes__item {
    flex: 0 0 var(--sn-card-size);
    width: var(--sn-card-size);
    max-width: none;
    min-width: 0;
    margin: 0;
    padding: 0;
    line-height: 0;
    scroll-snap-align: start;
  }

  .sn-weekly-prizes__item img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  .sn-weekly-prizes__dots {
    display: flex;
    width: fit-content;
    max-width: calc(100% - 32px);
    margin: clamp(18px, 2.4vw, 28px) auto 0;
    align-items: center;
    justify-content: center;
    gap: 14px;
    overflow: hidden;
    pointer-events: none;
  }

  .sn-weekly-prizes__dot {
    display: block;
    width: 12px;
    height: 12px;
    flex: 0 0 12px;
    border-radius: 999px;
    background: #ffffff;
    opacity: 1;
    transform: translateZ(0);
    transition: width 0.34s ease, flex-basis 0.34s ease, opacity 0.34s ease;
  }

  .sn-weekly-prizes__dot.is-active {
    width: 36px;
    flex-basis: 36px;
  }

  @media (max-width: 768px) {
    .sn-weekly-prizes {
      --sn-card-gap: 12px;
      --sn-card-size: clamp(248px, 78vw, 318px);
      --sn-side-pad: 16px;
    }

    .sn-weekly-prizes__viewport {
      max-width: none;
      padding: 0;
    }

    .sn-weekly-prizes__track {
      padding: 0 var(--sn-side-pad);
    }

    .sn-weekly-prizes__dots {
      gap: 11px;
      margin-top: 18px;
    }

    .sn-weekly-prizes__dot {
      width: 10px;
      height: 10px;
      flex-basis: 10px;
    }

    .sn-weekly-prizes__dot.is-active {
      width: 32px;
      flex-basis: 32px;
    }
  }

  @media (max-width: 380px) {
    .sn-weekly-prizes {
      --sn-card-size: 252px;
    }
  }
</style>

<script>
  (function () {
    var roots = document.querySelectorAll(".sn-weekly-prizes");

    roots.forEach(function (root) {
      if (root.getAttribute("data-sn-weekly-ready") === "true") return;
      root.setAttribute("data-sn-weekly-ready", "true");

      var viewport = root.querySelector(".sn-weekly-prizes__viewport");
      var track = root.querySelector(".sn-weekly-prizes__track");
      var dotsRoot = root.querySelector(".sn-weekly-prizes__dots");

      if (!viewport || !track) return;

      var originals = Array.prototype.slice.call(track.children);
      if (originals.length < 2) return;

      var DOT_COUNT = originals.length;
      var activeDotIndex = 0;
      var dots = [];

      if (dotsRoot) {
        dotsRoot.innerHTML = "";

        for (var dotIndex = 0; dotIndex < DOT_COUNT; dotIndex += 1) {
          var dot = document.createElement("span");
          dot.className = "sn-weekly-prizes__dot" + (dotIndex === 0 ? " is-active" : "");
          dotsRoot.appendChild(dot);
          dots.push(dot);
        }
      }

      var beforeFragment = document.createDocumentFragment();
      var afterFragment = document.createDocumentFragment();

      originals.forEach(function (card) {
        var before = card.cloneNode(true);
        before.setAttribute("aria-hidden", "true");
        before.classList.add("sn-weekly-prizes__item--clone");
        beforeFragment.appendChild(before);

        var after = card.cloneNode(true);
        after.setAttribute("aria-hidden", "true");
        after.classList.add("sn-weekly-prizes__item--clone");
        afterFragment.appendChild(after);
      });

      track.insertBefore(beforeFragment, track.firstChild);
      track.appendChild(afterFragment);

      var itemCount = originals.length;
      var autoTimer = null;
      var resumeTimer = null;
      var isResetting = false;

      function setActiveDot(index) {
        if (!dots.length) return;

        activeDotIndex = ((index % dots.length) + dots.length) % dots.length;

        dots.forEach(function (dot, dotIndex) {
          dot.classList.toggle("is-active", dotIndex === activeDotIndex);
        });
      }

      function getStep() {
        var firstCard = track.querySelector(".sn-weekly-prizes__item");
        var styles = window.getComputedStyle(track);
        var gap = parseFloat(styles.columnGap || styles.gap || "0") || 0;
        return firstCard ? firstCard.getBoundingClientRect().width + gap : viewport.clientWidth;
      }

      function getLoopWidth() {
        return getStep() * itemCount;
      }

      function setScrollLeftInstant(left) {
        var previousBehavior = viewport.style.scrollBehavior;
        viewport.style.scrollBehavior = "auto";
        viewport.scrollLeft = left;
        viewport.offsetHeight;
        viewport.style.scrollBehavior = previousBehavior;
      }

      function normalizePosition() {
        if (isResetting) return;

        var loopWidth = getLoopWidth();
        if (!loopWidth) return;

        var current = viewport.scrollLeft;

        if (current < loopWidth * 0.75) {
          isResetting = true;
          setScrollLeftInstant(current + loopWidth);
          requestAnimationFrame(function () { isResetting = false; });
        } else if (current > loopWidth * 2.25) {
          isResetting = true;
          setScrollLeftInstant(current - loopWidth);
          requestAnimationFrame(function () { isResetting = false; });
        }
      }

      function goNext() {
        normalizePosition();
        setActiveDot(activeDotIndex + 1);
        viewport.scrollBy({ left: getStep(), behavior: "smooth" });
      }

      function stopAuto() {
        window.clearInterval(autoTimer);
        autoTimer = null;
      }

      function startAuto() {
        stopAuto();
        autoTimer = window.setInterval(goNext, 3000);
      }

      function pauseThenResume() {
        stopAuto();
        window.clearTimeout(resumeTimer);
        resumeTimer = window.setTimeout(startAuto, 5000);
      }

      function setInitialPosition() {
        isResetting = true;
        setScrollLeftInstant(getLoopWidth());
        window.setTimeout(function () { isResetting = false; }, 160);
      }

      viewport.addEventListener("scroll", normalizePosition, { passive: true });
      viewport.addEventListener("pointerdown", pauseThenResume, { passive: true });
      root.addEventListener("mouseenter", stopAuto);
      root.addEventListener("mouseleave", startAuto);
      window.addEventListener("resize", function () {
        window.clearTimeout(resumeTimer);
        resumeTimer = window.setTimeout(setInitialPosition, 150);
      });

      window.setTimeout(function () {
        setInitialPosition();
        setActiveDot(0);
        startAuto();
      }, 250);
    });
  })();
</script>
